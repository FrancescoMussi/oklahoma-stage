<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oklahoma — Coming Soon</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #f5f6f8;
      --muted: #9aa3af;
      --accent: #e4572e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 640px; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 24px;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 16px; line-height: 1.1; }
    p { color: var(--muted); font-size: 1.125rem; line-height: 1.6; margin: 0; }
    footer { margin-top: 40px; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <span class="badge">Oklahoma · Staging</span>
    <h1>We're building something new.</h1>
    <p>This site is live and hosted on GitHub Pages. Content is on the way.</p>
    <footer>&copy; 2026</footer>
  </main>
</body>
</html>
